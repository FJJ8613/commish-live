<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commish Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live picks, scores and standings for the pool.">
<meta name="theme-color" content="#0d1321">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Commish Live">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f3f2ee; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #0b0e13; } }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #0d1321; color: #f4f5f7;
    font: 800 26px/1 'Arial Narrow', system-ui, sans-serif; letter-spacing: .06em; transition: opacity .3s; z-index: 2; }
  #splash b { color: #e5372b; margin-left: 6px; }
  #splash small { display: block; margin-top: 14px; font: 500 13px/1.4 system-ui, sans-serif; letter-spacing: 0; color: #9aa3b2; text-align: center; }
  #splash a { color: #9aa3b2; }
  #splash.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="splash"><div>COMMISH<b>LIVE</b><small id="sub">Loading…</small></div></div>
<iframe id="app" title="Commish Live" allow="clipboard-write; web-share; fullscreen"></iframe>
<script>
(function () {
  // The live app is a Google Apps Script web app. This page just shows it full-screen so it gets
  // a clean address, a proper home-screen icon, and a layout that fits the phone.
  var APP = 'https://script.google.com/macros/s/AKfycbzmKQMBj2QksgZmXmdg46emSpO-qRNbHczyvAopcD3wyXl-s7mVy5ktSBR1UpqGHmATTw/exec';
  var KEY = 'cl.shell.me';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }

  var q = new URLSearchParams(location.search);
  var me = q.get('me') || get(KEY) || '';
  var p = new URLSearchParams();
  p.set('shell', '1');
  if (me) p.set('me', me);
  if (q.get('sheet')) p.set('sheet', q.get('sheet'));
  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  frame.src = APP + '?' + p.toString();
  frame.addEventListener('load', function () { setTimeout(function () { splash.className = 'gone'; }, 400); });
  setTimeout(function () {
    if (splash.className !== 'gone') document.getElementById('sub').innerHTML = 'Still loading… <a href="' + frame.src + '">open directly</a>';
  }, 15000);

  // The app tells us who the viewer follows, so this page's address (and any home-screen icon
  // saved from it) opens on that entry next time.
  window.addEventListener('message', function (ev) {
    if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(ev.origin)) return;
    var d = ev.data;
    if (!d || d.type !== 'commish-follow' || typeof d.me !== 'string' || d.me.length > 60) return;
    set(KEY, d.me);
    var u = new URL(location.href);
    if (d.me) u.searchParams.set('me', d.me); else u.searchParams.delete('me');
    if (u.href !== location.href) history.replaceState(null, '', u.href);
  });
})();
</script>
<noscript><p style="font:16px system-ui;padding:20px">Commish Live needs JavaScript. <a href="https://script.google.com/macros/s/AKfycbzmKQMBj2QksgZmXmdg46emSpO-qRNbHczyvAopcD3wyXl-s7mVy5ktSBR1UpqGHmATTw/exec">Open the app directly</a>.</p></noscript>
</body>
</html>
